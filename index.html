<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ovum Kalyan Nagar Front Desk Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>:root{
  --paper:#F2EFE7;
  --paper-grid:#DFD8C9;
  --card:#FFFDF9;
  --ink:#24201D;
  --muted:#6B635B;
  --rule:#C9C1B4;

  --chrome:#1C1A18;
  --chrome-2:#25221F;
  --chrome-line:#3A3531;
  --chrome-ink:#EDE7DD;
  --chrome-muted:#948B80;

  --r-reception:#C96A4A;
  --r-doctor:#2E4A7B;
  --r-nurse:#A47C1B;
  --r-patient:#2F7D7B;
  --r-admin:#1E5F4B;
  --r-system:#3B3B3B;
  --r-pharmacist:#6E4B8E;

  --warn:#B23A25;
  --warn-bg:#FBEDE9;
  --info:#3D5580;
  --info-bg:#ECEFF6;
  --success:#1E5F4B;
  --success-bg:#E8F1EC;

  --font-display:"Newsreader",Georgia,"Times New Roman",serif;
  --font-sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--chrome);
  color:var(--chrome-ink);
  font-family:var(--font-sans);
  overflow:hidden;
}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}

.topbar{
  display:flex;align-items:center;gap:20px;
  padding:12px 20px;
  background:var(--chrome);
  border-bottom:1px solid var(--chrome-line);
  flex:0 0 auto;
}
.brand{display:flex;align-items:baseline;gap:14px;min-width:0}
.brand h1{
  font-family:var(--font-display);
  font-weight:500;font-size:20px;line-height:1.1;margin:0;
  letter-spacing:-.01em;color:var(--chrome-ink);
  white-space:nowrap;
}
.eyebrow{
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--chrome-muted);white-space:nowrap;
}
.counts{
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.09em;
  color:var(--chrome-muted);margin-left:auto;white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.tools{display:flex;gap:6px;flex:0 0 auto}
.btn{
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.07em;
  text-transform:uppercase;
  background:var(--chrome-2);color:var(--chrome-ink);
  border:1px solid var(--chrome-line);border-radius:4px;
  padding:7px 11px;cursor:pointer;
}
.btn:hover{background:#302C28;border-color:#4A443E}
.btn:focus-visible{outline:2px solid var(--r-nurse);outline-offset:2px}

.main{display:flex;flex:1 1 auto;min-height:0}

/* ---------- rail ---------- */
.rail{
  width:238px;flex:0 0 238px;
  background:var(--chrome);
  border-right:1px solid var(--chrome-line);
  overflow-y:auto;padding:16px 14px 28px;
}
.rail h2{
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--chrome-muted);
  margin:0 0 10px;font-weight:500;
}
.rail section + section{margin-top:24px;padding-top:20px;border-top:1px solid var(--chrome-line)}

.phase-list{display:flex;flex-direction:column;gap:1px}
.phase-btn{
  display:flex;align-items:center;gap:9px;width:100%;
  background:none;border:0;border-radius:4px;
  padding:7px 8px;cursor:pointer;text-align:left;color:var(--chrome-ink);
  font-family:var(--font-sans);font-size:12.5px;line-height:1.25;
}
.phase-btn:hover{background:var(--chrome-2)}
.phase-btn:focus-visible{outline:2px solid var(--r-nurse);outline-offset:-2px}
.phase-btn .num{
  font-family:var(--font-mono);font-size:9.5px;color:var(--chrome-muted);
  flex:0 0 20px;letter-spacing:.04em;
}
.phase-btn .swatch{width:3px;height:22px;border-radius:2px;flex:0 0 3px}
.phase-btn .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.legend div{
  display:flex;align-items:center;gap:6px;
  font-size:11px;color:var(--chrome-ink);
}
.legend .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.legend .sq{width:9px;height:9px;flex:0 0 9px;border:1.5px solid var(--chrome-muted)}
.legend .sq.gap{border-style:dashed;border-color:#D4735C}
.legend .sq.dec{transform:rotate(45deg);border-color:#C9A24B;width:8px;height:8px;flex-basis:8px}
.legend .sq.end{background:var(--chrome-ink);border-color:var(--chrome-ink);border-radius:50%}

.minimap-wrap{display:flex;justify-content:center}
.minimap{
  position:relative;cursor:pointer;
  border:1px solid var(--chrome-line);border-radius:3px;
  background:#0F0E0D;line-height:0;
}
.minimap canvas{display:block;border-radius:2px}
.mm-view{
  position:absolute;border:1.5px solid #E8B23C;
  background:rgba(232,178,60,.14);pointer-events:none;border-radius:1px;
}

/* ---------- canvas ---------- */
.viewport{
  flex:1 1 auto;position:relative;overflow:hidden;
  background:
    linear-gradient(var(--paper-grid) 1px,transparent 1px) 0 0/40px 40px,
    linear-gradient(90deg,var(--paper-grid) 1px,transparent 1px) 0 0/40px 40px,
    var(--paper);
  cursor:grab;
}
.viewport.dragging{cursor:grabbing}
.canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.layer{position:absolute;top:0;left:0}
#edges{overflow:visible;pointer-events:none}

/* ---------- bands ---------- */
.band{
  position:absolute;border-radius:9px;
  border:1px solid var(--rule);
  border-left-width:4px;
}
.band-hd{
  position:absolute;top:-13px;left:16px;
  display:flex;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--rule);
  border-radius:5px;padding:4px 12px;white-space:nowrap;
}
.band-hd .t{
  font-family:var(--font-display);font-size:14.5px;font-weight:600;
  color:var(--ink);letter-spacing:-.005em;
}
.band-hd .o{
  font-family:var(--font-mono);font-size:9px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);
}

/* ---------- nodes ---------- */
.n{
  position:absolute;
  background:var(--card);
  border:1px solid var(--rule);
  border-radius:5px;
  padding:9px 11px 10px;
  box-shadow:0 1px 0 rgba(36,32,29,.05),0 2px 6px rgba(36,32,29,.05);
  color:var(--ink);
}
.n .role{
  display:block;
  font-family:var(--font-mono);font-size:8px;letter-spacing:.15em;
  text-transform:uppercase;margin-bottom:5px;font-weight:500;
}
.n .lbl{font-size:12px;line-height:1.32;font-weight:500;text-wrap:balance}
.n ul{margin:7px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.n li{
  font-size:10.5px;line-height:1.35;color:var(--muted);
  padding-left:9px;position:relative;
}
.n li::before{
  content:"";position:absolute;left:0;top:.52em;
  width:4px;height:1px;background:var(--rule);
}
.n .ext{
  display:inline-block;margin-top:8px;
  font-family:var(--font-mono);font-size:7.5px;letter-spacing:.14em;
  text-transform:uppercase;color:#8A6A3A;
  border:1px solid #E0CFA8;background:#FBF4E4;
  border-radius:3px;padding:2px 5px;
}

.n-start{
  background:#EAF2EE;border-color:#9DBFB0;border-radius:22px;
  padding:11px 16px;
}
.n-end{
  background:var(--ink);border-color:var(--ink);color:var(--card);
  border-radius:22px;padding:11px 16px;
}
.n-end .lbl{color:var(--card)}

.n-decision{
  background:#FBF3DC;border-color:#C9A24B;
  clip-path:polygon(13px 0,calc(100% - 13px) 0,100% 13px,100% calc(100% - 13px),
    calc(100% - 13px) 100%,13px 100%,0 calc(100% - 13px),0 13px);
  padding:12px 15px;box-shadow:none;
}
.n-decision .lbl::before{content:"◆  ";color:#A47C1B;font-size:9px;vertical-align:2px}

.n-note{
  background:var(--info-bg);border:1px dashed var(--info);
  box-shadow:none;
}
.n-note .tag{
  display:block;font-family:var(--font-mono);font-size:8px;
  letter-spacing:.15em;text-transform:uppercase;
  margin-bottom:5px;font-weight:500;color:var(--info);
}
.n-note .lbl{font-weight:500;font-size:11.5px}
.n-note li::before{background:currentColor;opacity:.35}
.n-note.warn{background:var(--warn-bg);border-color:var(--warn);color:#5C2416}
.n-note.warn .tag{color:var(--warn)}
.n-note.warn li{color:#7A3B2A}
.n-note.success{background:var(--success-bg);border-color:var(--success)}
.n-note.success .tag{color:var(--success)}

/* ---------- edge labels ---------- */
.elabel{
  position:absolute;transform:translate(-50%,-50%);
  font-family:var(--font-mono);font-size:9px;letter-spacing:.05em;
  background:var(--paper);color:#4A423B;
  border:1px solid var(--rule);border-radius:3px;
  padding:2px 6px;white-space:nowrap;pointer-events:none;
}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

@media (max-width:820px){
  .rail{display:none}
  .brand h1{font-size:16px}
  .eyebrow,.counts{display:none}
}

/* ================= edit mode ================= */
.btn.on{background:#8A6A2A;border-color:#C9A24B;color:#FFF7E4}
.viewport.linking{cursor:crosshair}
.n.editable{cursor:move}
.n.sel{outline:2px solid #E8B23C;outline-offset:3px}
.n.linksrc{outline:2px dashed #1E5F4B;outline-offset:3px}
.ehit{stroke:transparent;stroke-width:14;fill:none;pointer-events:stroke;cursor:pointer}
.epath.sel{stroke:#E8B23C!important;stroke-width:3!important}

.inspector{
  width:298px;flex:0 0 298px;background:var(--chrome);
  border-left:1px solid var(--chrome-line);
  overflow-y:auto;padding:16px 16px 40px;
}
.inspector h2{
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--chrome-muted);margin:0 0 4px;font-weight:500;
}
.insp-id{
  font-family:var(--font-mono);font-size:10px;color:#7E756A;
  margin-bottom:16px;word-break:break-all;
}
.fld{margin-bottom:13px}
.fld label{
  display:block;font-family:var(--font-mono);font-size:9px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--chrome-muted);margin-bottom:5px;
}
.fld input[type=text],.fld textarea,.fld select{
  width:100%;background:#141312;color:var(--chrome-ink);
  border:1px solid var(--chrome-line);border-radius:4px;
  padding:7px 8px;font-family:var(--font-sans);font-size:12px;line-height:1.4;
}
.fld textarea{resize:vertical;min-height:56px}
.fld input:focus,.fld textarea:focus,.fld select:focus{
  outline:none;border-color:#C9A24B;
}
.fld.row{display:flex;align-items:center;gap:8px}
.fld.row label{margin:0;text-transform:none;letter-spacing:.03em;font-size:11px;font-family:var(--font-sans);color:var(--chrome-ink)}
.fld.row input[type=checkbox]{width:auto;accent-color:#C9A24B}
.insp-actions{display:flex;gap:6px;margin-top:18px}
.btn.danger{border-color:#7A3428;color:#E8A092}
.btn.danger:hover{background:#3A1D18}
.btn.wide{flex:1;text-align:center}
.hint{font-size:11px;line-height:1.5;color:var(--chrome-muted)}
.hint b{color:var(--chrome-ink);font-weight:500}
.hint code{
  font-family:var(--font-mono);font-size:10px;background:#141312;
  border:1px solid var(--chrome-line);border-radius:3px;padding:1px 4px;
}

.modal{
  position:fixed;inset:0;background:rgba(10,9,8,.72);
  display:flex;align-items:center;justify-content:center;z-index:50;padding:32px;
}
.modal[hidden]{display:none}
.modal-box{
  background:var(--chrome);border:1px solid var(--chrome-line);border-radius:8px;
  width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;padding:20px;
}
.modal-box h3{
  font-family:var(--font-display);font-size:18px;font-weight:500;
  margin:0 0 6px;color:var(--chrome-ink);
}
.modal-box p{margin:0 0 14px;font-size:12px;line-height:1.55;color:var(--chrome-muted)}
.modal-box textarea{
  flex:1;min-height:280px;background:#141312;color:#CFC7BB;
  border:1px solid var(--chrome-line);border-radius:5px;padding:11px;
  font-family:var(--font-mono);font-size:11px;line-height:1.5;resize:none;
}
.modal-actions{display:flex;gap:7px;margin-top:14px;justify-content:flex-end}

/* ================= scrollbars ================= */
.sbar{
  position:absolute;z-index:6;
  background:rgba(36,32,29,.05);
  border:0 solid rgba(36,32,29,.12);
}
.sbar[hidden]{display:none}
.sbar-v{top:0;right:0;bottom:15px;width:15px;border-left-width:1px;cursor:default}
.sbar-h{left:0;right:15px;bottom:0;height:15px;border-top-width:1px;cursor:default}
.sthumb{
  position:absolute;border-radius:8px;
  background:#9A9184;border:1px solid rgba(36,32,29,.18);
  cursor:grab;
}
.sthumb:hover{background:#7C7367}
.sthumb.drag{background:#544D45;cursor:grabbing}
.sbar-v .sthumb{left:3px;right:3px;min-height:32px}
.sbar-h .sthumb{top:3px;bottom:3px;min-width:32px}
.sbar-corner{
  position:absolute;right:0;bottom:0;width:15px;height:15px;z-index:6;
  background:rgba(36,32,29,.05);
  border-left:1px solid rgba(36,32,29,.12);
  border-top:1px solid rgba(36,32,29,.12);
}
.sbar-corner[hidden]{display:none}

.railhint{
  margin:12px 0 0;text-align:center;
  font-size:10.5px;line-height:1.6;color:var(--chrome-muted);
}
.railhint b{
  font-family:var(--font-mono);font-size:9.5px;color:var(--chrome-ink);
  border:1px solid var(--chrome-line);border-radius:3px;padding:1px 4px;font-weight:500;
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="eyebrow">Field Visit · Front Desk Research</span>
      <h1>Ovum Kalyan Nagar</h1>
    </div>
    <div class="counts" id="counts"></div>
    <div class="tools" id="editTools" hidden>
      <button class="btn" id="addnode" type="button">New card</button>
      <button class="btn" id="undo" type="button">Undo</button>
      <button class="btn" id="export" type="button">Export JSON</button>
      <button class="btn" id="savehtml" type="button">Save copy</button>
    </div>
    <div class="tools">
      <button class="btn" id="edit" type="button">Edit</button>
      <button class="btn" id="top" type="button">Top</button>
      <button class="btn" id="fit" type="button">Fit all</button>
      <button class="btn" id="zout" type="button">&minus;</button>
      <button class="btn" id="zin" type="button">+</button>
    </div>
  </header>
  <div class="main">
    <aside class="rail">
      <section>
        <h2>Jump to phase</h2>
        <div class="phase-list" id="phaseList"></div>
      </section>
      <section>
        <h2>Who does it</h2>
        <div class="legend" id="legendRoles"></div>
      </section>
      <section>
        <h2>Node types</h2>
        <div class="legend">
          <div><span class="sq" style="border-color:#9DBFB0;background:#EAF2EE"></span>Start</div>
          <div><span class="sq end"></span>End</div>
          <div><span class="sq dec"></span>Decision</div>
          <div><span class="sq"></span>Step</div>
          <div><span class="sq gap"></span>Gap</div>
          <div><span class="sq" style="border-style:dashed;border-color:#3D5580"></span>Note</div>
        </div>
      </section>
      <section>
        <h2>Overview</h2>
        <div class="minimap-wrap">
          <div class="minimap"><canvas id="mm"></canvas><div class="mm-view" id="mmView"></div></div>
        </div>
        <p class="railhint">Scroll to move up and down<br><b>Shift</b> + scroll to move sideways<br><b>Ctrl</b> + scroll to zoom</p>
      </section>
    </aside>
    <div class="viewport" id="vp">
      <div class="canvas" id="canvas">
        <div class="layer" id="bands"></div>
        <svg class="layer" id="edges" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="layer" id="labels"></div>
        <div class="layer" id="nodes"></div>
      </div>
      <div class="sbar sbar-v" id="sbv"><div class="sthumb" id="sbvt"></div></div>
      <div class="sbar sbar-h" id="sbh"><div class="sthumb" id="sbht"></div></div>
      <div class="sbar-corner" id="sbc"></div>
    </div>
    <aside class="inspector" id="inspector" hidden></aside>
  </div>
</div>
<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <h3 id="mTitle"></h3>
    <p id="mNote"></p>
    <textarea id="mText" readonly spellcheck="false"></textarea>
    <div class="modal-actions">
      <button class="btn" id="mCopy" type="button">Copy</button>
      <button class="btn" id="mDownload" type="button">Download</button>
      <button class="btn" id="mClose" type="button">Close</button>
    </div>
  </div>
</div>

      return;
    }
    if (editMode && !nEl) { sel = null; linkFrom = null; vp.classList.remove("linking"); render(); closeInspector(); }
    drag = { kind: "pan", x: ev.clientX, y: ev.clientY, tx: tx, ty: ty };
    vp.setPointerCapture(ev.pointerId); vp.classList.add("dragging");
  });

  vp.addEventListener("pointermove", function (ev) {
    if (!drag) return;
    if (drag.kind === "pan") {
      tx = drag.tx + (ev.clientX - drag.x); ty = drag.ty + (ev.clientY - drag.y); apply();
    } else {
      var n = nodeById(drag.id); if (!n) return;
      if (!drag.moved) { pushUndo(); drag.moved = true; }
      n.position.x = Math.round(drag.nx + (ev.clientX - drag.x) / k);
      n.position.y = Math.round(drag.ny + (ev.clientY - drag.y) / k);
      var r = rects[drag.id];
      r.x = n.position.x; r.y = n.position.y;
      r.el.style.left = r.x + "px"; r.el.style.top = r.y + "px";
      drawEdges();
    }
  });

  ["pointerup", "pointercancel"].forEach(function (t) {
    vp.addEventListener(t, function () {
      var wasNode = drag && drag.kind === "node" && drag.moved;
      drag = null; vp.classList.remove("dragging");
      if (wasNode) { renderBands(); sizeCanvas(); drawEdges(); drawMinimap(); }
    });
  });

  // ---------------- editing ----------------
  function createEdge(s, t) {
    pushUndo();
    var id = s + "->" + t;
    if (state.edges.some(function (e) { return e.id === id; })) return;
    state.edges.push({
      id: id, source: s, target: t, type: "smoothstep", animated: false,
      style: { stroke: "#5B5550", strokeWidth: 1.6 },
      labelStyle: { fill: "#3a3430", fontSize: 11, fontWeight: 500 },
      labelBgStyle: { fill: "#F5F2EA" }, labelBgPadding: [6, 3], labelBgBorderRadius: 4,
      markerEnd: { type: "arrowclosed", color: "#5B5550" }
    });
    sel = id;
  }

  function addNode() {
    pushUndo();
    var r = vp.getBoundingClientRect();
    var cx = Math.round((r.width / 2 - tx) / k + ORIGIN.x) - W_STEP / 2;
    var cy = Math.round((r.height / 2 - ty) / k + ORIGIN.y);
    var ph = "ph-1";
    Object.keys(phaseBox).forEach(function (id) {
      var b = phaseBox[id].box;
      if (b && cy >= b.y && cy <= b.y + b.h) ph = id;
    });
    var i = 1; while (nodeById("new-" + i)) i++;
    state.nodes.push({
      id: "new-" + i, type: "step", position: { x: cx, y: cy },
      data: { label: "New step", role: "reception", phase: ph }
    });
    sel = "new-" + i;
    render(); openInspector();
  }

  function deleteSelected() {
    if (!sel) return;
    pushUndo();
    if (nodeById(sel)) {
      state.nodes = state.nodes.filter(function (n) { return n.id !== sel; });
      state.edges = state.edges.filter(function (e) { return e.source !== sel && e.target !== sel; });
    } else {
      state.edges = state.edges.filter(function (e) { return e.id !== sel; });
    }
    sel = null; render(); closeInspector();
  }

  function undo() {
    if (!undoStack.length) return;
    var s = JSON.parse(undoStack.pop());
    state.nodes = s.nodes; state.edges = s.edges;
    sel = null; render(); closeInspector();
  }

  // ---------------- inspector ----------------
  function closeInspector() { insp.hidden = true; }

  function openInspector() {
    if (!sel) return closeInspector();
    insp.hidden = false;
    var n = nodeById(sel);
    if (n) return inspectNode(n);
    var e = state.edges.filter(function (x) { return x.id === sel; })[0];
    if (e) return inspectEdge(e);
    closeInspector();
  }

  function opts(list, cur) {
    return list.map(function (o) {
      var v = typeof o === "string" ? o : o[0], t = typeof o === "string" ? o : o[1];
      return '<option value="' + v + '"' + (v === cur ? " selected" : "") + ">" + esc(t) + "</option>";
    }).join("");
  }

  function inspectNode(n) {
    var d = n.data || (n.data = {});
    var isNote = n.type === "note";
    var h = '<h2>Node</h2><div class="insp-id">' + esc(n.id) + "</div>";
    h += '<div class="fld"><label>Type</label><select id="f-type">' +
      opts([["step", "Step"], ["decision", "Decision"], ["note", "Note / Gap"],
            ["start", "Start"], ["end", "End"]], n.type) + "</select></div>";
    if (isNote) {
      h += '<div class="fld"><label>Tone</label><select id="f-tone">' +
        opts([["warn", "Gap (red)"], ["info", "Note (blue)"], ["success", "Supported (green)"]],
             d.tone || "info") + "</select></div>";
    } else {
      h += '<div class="fld"><label>Who does it</label><select id="f-role">' +
        opts(Object.keys(ROLE_NAME).map(function (r) { return [r, ROLE_NAME[r]]; }), d.role || "reception") +
        "</select></div>";
    }
    h += '<div class="fld"><label>Phase</label><select id="f-phase">' +
      opts(phases.map(function (p) { return [p.id, p.data.label]; }), phaseOf(n)) + "</select></div>";
    h += '<div class="fld"><label>Label</label><textarea id="f-label" rows="3">' +
      esc(d.label || "") + "</textarea></div>";
    h += '<div class="fld"><label>Detail lines (one per line)</label><textarea id="f-items" rows="5">' +
      esc((d.items || []).join("\n")) + "</textarea></div>";
    if (!isNote) {
      h += '<div class="fld row"><input type="checkbox" id="f-int"' +
        (d.integration ? " checked" : "") + '><label for="f-int">Runs on an external system</label></div>';
    }
    h += '<div class="insp-actions"><button class="btn wide" id="f-link" type="button">Draw link from here</button></div>';
    h += '<div class="insp-actions"><button class="btn danger wide" id="f-del" type="button">Delete node</button></div>';
    insp.innerHTML = h;

    function commit(fn) { pushUndo(); fn(); render(); openInspector(); }
    $("f-type").addEventListener("change", function () {
      commit(function () {
        n.type = $("f-type").value;
        if (n.type === "note") { d.tone = d.tone || "info"; delete d.role; delete d.integration; }
        else { d.role = d.role || "reception"; delete d.tone; }
      });
    });
    if ($("f-tone")) $("f-tone").addEventListener("change", function () { commit(function () { d.tone = $("f-tone").value; }); });
    if ($("f-role")) $("f-role").addEventListener("change", function () { commit(function () { d.role = $("f-role").value; }); });
    $("f-phase").addEventListener("change", function () { commit(function () { d.phase = $("f-phase").value; }); });
    if ($("f-int")) $("f-int").addEventListener("change", function () { commit(function () { d.integration = $("f-int").checked; }); });

    ["f-label", "f-items"].forEach(function (id) {
      var el = $(id), before = null;
      el.addEventListener("focus", function () { before = el.value; });
      el.addEventListener("blur", function () {
        if (el.value === before) return;
        pushUndo();
        if (id === "f-label") d.label = el.value;
        else {
          var lines = el.value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
          if (lines.length) d.items = lines; else delete d.items;
        }
        render(); openInspector();
      });
    });
    $("f-link").addEventListener("click", function () {
      linkFrom = n.id; vp.classList.add("linking"); render();
    });
    $("f-del").addEventListener("click", deleteSelected);
  }

  function inspectEdge(e) {
    var dashed = !!(e.style && e.style.strokeDasharray);
    var h = '<h2>Link</h2><div class="insp-id">' + esc(e.source) + " → " + esc(e.target) + "</div>";
    h += '<div class="fld"><label>Label on the arrow</label><input type="text" id="e-label" value="' +
      esc(e.label || "") + '"></div>';
    h += '<div class="fld"><label>Line style</label><select id="e-style">' +
      opts([["solid", "Solid (main flow)"], ["dashed", "Dashed (cross-link)"]], dashed ? "dashed" : "solid") +
      "</select></div>";
    h += '<div class="fld"><label>Colour</label><select id="e-color">' +
      opts([["#5B5550", "Grey (default)"], ["#1E5F4B", "Green (cross-link)"],
            ["#C96A4A", "Orange (billing)"]], (e.style && e.style.stroke) || "#5B5550") + "</select></div>";
    h += '<div class="insp-actions"><button class="btn danger wide" id="e-del" type="button">Delete link</button></div>';
    insp.innerHTML = h;

    var lab = $("e-label"), before = lab.value;
    lab.addEventListener("blur", function () {
      if (lab.value === before) return;
      pushUndo();
      if (lab.value.trim()) e.label = lab.value.trim(); else delete e.label;
      render(); openInspector();
    });
    $("e-style").addEventListener("change", function () {
      pushUndo();
      e.style = e.style || {};
      if ($("e-style").value === "dashed") e.style.strokeDasharray = "6 4";
      else delete e.style.strokeDasharray;
      render(); openInspector();
    });
    $("e-color").addEventListener("change", function () {
      pushUndo();
      e.style = e.style || {}; e.style.stroke = $("e-color").value;
      e.markerEnd = { type: "arrowclosed", color: $("e-color").value };
      render(); openInspector();
    });
    $("e-del").addEventListener("click", deleteSelected);
  }

  // ---------------- export ----------------
  function download(name, text, mime) {
    try {
      var b = new Blob([text], { type: mime });
      var u = URL.createObjectURL(b), a = document.createElement("a");
      a.href = u; a.download = name; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(u); a.remove(); }, 1500);
      return true;
    } catch (err) { return false; }
  }

  function showModal(title, note, text, filename, mime) {
    $("mTitle").textContent = title;
    $("mNote").textContent = note;
    $("mText").value = text;
    $("modal").hidden = false;
    $("mDownload").onclick = function () { download(filename, text, mime); };
    $("mCopy").onclick = function () {
      var t = $("mText"); t.select();
      if (navigator.clipboard) navigator.clipboard.writeText(text).catch(function () {});
      else try { document.execCommand("copy"); } catch (err) {}
      $("mCopy").textContent = "Copied";
      setTimeout(function () { $("mCopy").textContent = "Copy"; }, 1400);
    };
  }

  function exportJSON() {
    showModal("Export flow JSON",
      "This is the file to attach in Emergent, or to keep as a backup. If the download is blocked, copy the text instead.",
      JSON.stringify({ nodes: state.nodes, edges: state.edges }, null, 2),
      "ovum-front-desk-flow.json", "application/json");
  }

  function saveHTML() {
    var clone = document.documentElement.cloneNode(true);
    ["nodes", "bands", "labels", "edges", "phaseList", "legendRoles"].forEach(function (id) {
      var el = clone.querySelector("#" + id); if (el) el.innerHTML = "";
    });
    var c = clone.querySelector("#canvas");
    if (c) { c.style.transform = ""; c.style.width = ""; c.style.height = ""; }
    var i = clone.querySelector("#inspector"); if (i) { i.innerHTML = ""; i.hidden = true; }
    var m = clone.querySelector("#modal"); if (m) m.hidden = true;
    var fd = clone.querySelector("#flowdata");
    if (fd) fd.textContent = "const FLOW_DATA=" + JSON.stringify({ nodes: state.nodes, edges: state.edges }) + ";";
    var html = "<!doctype html>\n" + clone.outerHTML;
    showModal("Save an updated copy",
      "Press Download to save this as your new atlas file. If nothing downloads (you are viewing on the web, not from your own file), copy the text and save it as a .html file.",
      html, "ovum-front-desk-atlas.html", "text/html");
  }

  // ---------------- minimap ----------------
  var mmC = $("mm"), mmView = $("mmView"), mmK = 1, mmW = 0, mmH = 0;
  function drawMinimap() {
    mmK = Math.min(150 / CW, 430 / CH);
    mmW = Math.max(1, Math.round(CW * mmK)); mmH = Math.max(1, Math.round(CH * mmK));
    mmC.width = mmW; mmC.height = mmH;
    mmC.parentNode.style.width = mmW + "px"; mmC.parentNode.style.height = mmH + "px";
    var g = mmC.getContext("2d");
    g.fillStyle = "#F2EFE7"; g.fillRect(0, 0, mmW, mmH);
    phases.forEach(function (p) {
      var b = phaseBox[p.id] && phaseBox[p.id].box; if (!b) return;
      g.fillStyle = p.data.accent;
      g.fillRect((b.x - ORIGIN.x) * mmK, (b.y - ORIGIN.y) * mmK, b.w * mmK, b.h * mmK);
      g.fillStyle = p.data.stroke;
      g.fillRect((b.x - ORIGIN.x) * mmK, (b.y - ORIGIN.y) * mmK, 1.5, b.h * mmK);
    });
    items.forEach(function (n) {
      var r = rects[n.id], d = n.data || {};
      if (n.type === "note") g.fillStyle = d.tone === "warn" ? "#C0503A" : "#8894AC";
      else if (n.type === "decision") g.fillStyle = "#C9A24B";
      else if (n.type === "end") g.fillStyle = "#24201D";
      else g.fillStyle = ROLE_COLOR[d.role] || "#3B3B3B";
      g.fillRect((r.x - ORIGIN.x) * mmK, (r.y - ORIGIN.y) * mmK,
        Math.max(1.5, r.w * mmK), Math.max(1, r.h * mmK));
    });
    drawMinimapView();
  }
  function drawMinimapView() {
    if (!ORIGIN) return;
    var r = vp.getBoundingClientRect();
    mmView.style.left = Math.max(0, (-tx / k) * mmK) + "px";
    mmView.style.top = Math.max(0, (-ty / k) * mmK) + "px";
    mmView.style.width = Math.min(mmW, (r.width / k) * mmK) + "px";
    mmView.style.height = Math.min(mmH, (r.height / k) * mmK) + "px";
  }
  mmC.parentNode.addEventListener("click", function (ev) {
    var b = mmC.getBoundingClientRect(), r = vp.getBoundingClientRect();
    tx = r.width / 2 - ((ev.clientX - b.left) / mmK) * k;
    ty = r.height / 2 - ((ev.clientY - b.top) / mmK) * k;
    apply();
  });

  // ---------------- wiring ----------------
  $("zin").addEventListener("click", function () { zoomBy(1.3); });
  $("zout").addEventListener("click", function () { zoomBy(1 / 1.3); });
  $("fit").addEventListener("click", fitAll);
  $("top").addEventListener("click", fitWidth);
  $("export").addEventListener("click", exportJSON);
  $("savehtml").addEventListener("click", saveHTML);
  $("addnode").addEventListener("click", addNode);
  $("undo").addEventListener("click", undo);
  $("mClose").addEventListener("click", function () { $("modal").hidden = true; });
  $("modal").addEventListener("click", function (ev) {
    if (ev.target === $("modal")) $("modal").hidden = true;
  });

  $("edit").addEventListener("click", function () {
    editMode = !editMode;
    sel = null; linkFrom = null;
    vp.classList.remove("linking");
    $("edit").classList.toggle("on", editMode);
    $("edit").textContent = editMode ? "Editing" : "Edit";
    $("editTools").hidden = !editMode;
    if (!editMode) closeInspector(); else showHelp();
    render();
  });

  function showHelp() {
    insp.hidden = false;
    insp.innerHTML = '<h2>Edit mode</h2><div class="insp-id">Nothing selected</div>' +
      '<div class="hint"><p><b>Move</b> a card by dragging it.</p>' +
      '<p><b>Edit</b> a card by clicking it, then changing the fields here.</p>' +
      '<p><b>Add</b> a card with the New card button, then drag it where you want.</p>' +
      '<p><b>Link</b> two cards: select one, press Draw link from here, then click the other card.</p>' +
      '<p><b>Delete</b> what is selected with the Delete key.</p>' +
      '<p><b>Undo</b> with <code>Ctrl</code> + <code>Z</code>.</p>' +
      '<p>When you are done, press <b>Export JSON</b> for Emergent, or <b>Save copy</b> to keep an updated HTML file.</p></div>';
  }

  document.addEventListener("keydown", function (ev) {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
    var r = vp.getBoundingClientRect(), STEP = 90;
    var nav = {
      ArrowDown: [0, STEP], ArrowUp: [0, -STEP], ArrowRight: [STEP, 0], ArrowLeft: [-STEP, 0],
      PageDown: [0, r.height * 0.85], PageUp: [0, -r.height * 0.85]
    };
    if (nav[ev.key] && !ev.ctrlKey && !ev.metaKey) {
      ev.preventDefault(); scrollBy(nav[ev.key][0], nav[ev.key][1]); return;
    }
    if (ev.key === "Home" && !ev.ctrlKey) { ev.preventDefault(); ty = 0; apply(); return; }
    if (ev.key === "End" && !ev.ctrlKey) { ev.preventDefault(); ty = -1e9; apply(); return; }
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "z") { ev.preventDefault(); undo(); }
    else if ((ev.key === "Delete" || ev.key === "Backspace") && editMode && sel) { ev.preventDefault(); deleteSelected(); }
    else if (ev.key === "Escape") {
      if (!$("modal").hidden) $("modal").hidden = true;
      else { sel = null; linkFrom = null; vp.classList.remove("linking"); render(); closeInspector(); }
    }
  });

  var lg = $("legendRoles");
  Object.keys(ROLE_NAME).forEach(function (r) {
    var d = document.createElement("div");
    d.innerHTML = '<span class="dot" style="background:' + ROLE_COLOR[r] + '"></span>' + ROLE_NAME[r];
    lg.appendChild(d);
  });

  render(true);
  fitWidth();
  booted = true;
  window.addEventListener("resize", apply);
})();
</script>
</body>
</html>
